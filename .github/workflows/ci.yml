name: Homebrew
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  install:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
        with:
          stable: true
      - name: Check formula style
        run: brew style HelloNoel/tap/aiexandria
      - name: Install from this checkout
        run: brew install HelloNoel/tap/aiexandria
      - name: Test installed formula
        run: brew test HelloNoel/tap/aiexandria
      - name: Audit formula
        run: brew audit --strict HelloNoel/tap/aiexandria
